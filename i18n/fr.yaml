note_hand: "Carte postale de la route —"
note_body: "Chers amis : vous ne croirez jamais ce que nous avons trouvé dans un champ au bord de l'autoroute. Un orignal aux proportions monstrueuses, un pérogý planté sur une fourchette, une piste d'atterrissage construite pour des visiteurs qui ne sont jamais venus. Voyager, ce n'est pas la destination — c'est l'étrangeté pure et délicieuse qu'on rencontre en chemin."
