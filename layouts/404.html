{{ define "main" }}
<main class="wrap page">
  <article class="post" style="text-align:center">
    <header class="post-head">
      <p class="kicker">{{ i18n "e404_kicker" }}</p>
      <h1>{{ i18n "e404_h1" }}</h1>
      <p class="standfirst">{{ i18n "e404_standfirst" }}</p>
    </header>
    <p><a class="btn" href="{{ "/" | relLangURL }}">{{ i18n "e404_btn" }}</a></p>
    <p style="margin-top:1rem"><a href="{{ "/articles/" | relLangURL }}">{{ i18n "e404_browse" }}</a> &middot; <a href="{{ "/atlas/" | relLangURL }}">{{ i18n "e404_atlas" }}</a></p>
  </article>
</main>
{{ end }}
