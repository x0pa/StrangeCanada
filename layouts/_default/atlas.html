{{ define "main" }}
<main class="wrap page">
  <article class="post">
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="{{ "/" | relLangURL }}">{{ i18n "crumbs_home" }}</a> <span aria-hidden="true">/</span>
      <span>{{ i18n "nav_atlas" }}</span>
    </nav>
    <header class="post-head">
      <p class="kicker">{{ i18n "atlas_kicker" }}</p>
      <h1>{{ i18n "atlas_h1" }}</h1>
      <p class="standfirst">{{ .Description }}</p>
    </header>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <div id="sc-map" class="postcard" style="height:520px;max-height:70vh;z-index:0" role="application" aria-label="{{ i18n "atlas_map_aria" }}"></div>
    <div class="prose" style="margin-top:1.4rem">
      {{ .Content }}
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
    (function(){
      var stops = [
        {n:"Sandon — the silver boomtown", t:"British Columbia", lat:49.975, lng:-117.228, u:"{{ "/articles/chasing-ghosts-in-bcs-interior/" | relLangURL }}"},
        {n:"Barkerville Historic Town", t:"British Columbia", lat:53.065, lng:-121.517, u:"{{ "/articles/chasing-ghosts-in-bcs-interior/" | relLangURL }}"},
        {n:"Phoenix — the town that was dismantled", t:"British Columbia", lat:49.098, lng:-118.598, u:"{{ "/articles/chasing-ghosts-in-bcs-interior/" | relLangURL }}"},
        {n:"The Giant Perogy", t:"Glendon, Alberta", lat:54.248, lng:-111.158, u:"{{ "/articles/the-giant-perogy-of-glendon/" | relLangURL }}"},
        {n:"The UFO Landing Pad", t:"St. Paul, Alberta", lat:53.993, lng:-111.297, u:"{{ "/articles/the-ufo-landing-pad-of-st-paul/" | relLangURL }}"},
        {n:"Mac the Moose", t:"Moose Jaw, Saskatchewan", lat:50.393, lng:-105.534, u:"{{ "/articles/mac-the-moose/" | relLangURL }}"},
        {n:"Happy Rock", t:"Gladstone, Manitoba", lat:50.226, lng:-98.951, u:"{{ "/articles/happy-rock-gladstone/" | relLangURL }}"},
        {n:"The World's Largest Curling Rock (town's claim)", t:"Arborg, Manitoba", lat:50.910, lng:-97.216, u:"{{ "/articles/worlds-largest-curling-rock-arborg/" | relLangURL }}"},
        {n:"Falcon Lake UFO Site", t:"Whiteshell, Manitoba", lat:49.686, lng:-95.327, u:"{{ "/articles/falcon-lake-ufo/" | relLangURL }}"},
        {n:"The Big Nickel", t:"Sudbury, Ontario", lat:46.473, lng:-81.033, u:"{{ "/articles/the-big-nickel-sudbury/" | relLangURL }}"},
        {n:"Sign Post Forest", t:"Watson Lake, Yukon", lat:60.063, lng:-128.705, u:"{{ "/articles/sign-post-forest-watson-lake/" | relLangURL }}"},
        {n:"Magnetic Hill", t:"Moncton, New Brunswick", lat:46.137, lng:-64.885, u:"{{ "/articles/magnetic-hill-moncton/" | relLangURL }}"},
        {n:"The World's Largest Lobster (town's claim)", t:"Shediac, New Brunswick", lat:46.219, lng:-64.540, u:"{{ "/articles/worlds-largest-lobster-shediac/" | relLangURL }}"}
      ];
      var map = L.map('sc-map').setView([54.5, -96], 4);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'}).addTo(map);
      stops.forEach(function(s){
        var html = '<strong>' + s.n + '</strong><br>' + s.t + (s.u ? '<br><a href="' + s.u + '">{{ i18n "atlas_read_notes" }}</a>' : '');
        L.marker([s.lat, s.lng]).addTo(map).bindPopup(html);
      });
    })();
    </script>
  </article>
</main>
{{ end }}
