{{ define "main" }}
<main class="wrap page">
  <header class="post-head">
    <p class="kicker">{{ i18n "list_kicker" }}</p>
    <h1>{{ .Title }}</h1>
  </header>
  <div class="cards">
    {{ range .Pages }}
    {{ $p := . }}
    <article class="postcard story-card tilt-l">
      <a class="card-link" href="{{ .RelPermalink }}">
        {{ with .Params.image }}<img class="card-img" src="{{ . | relURL }}" alt="{{ $p.Params.image_alt }}">{{ end }}
        <h2>{{ .Title }}</h2>
      </a>
      <p class="caption">{{ .Description }}</p>
    </article>
    {{ end }}
  </div>
  {{ if eq .Section "articles" }}
  {{ partial "ads/slot-08-native.html" . }}
  {{ end }}
</main>
{{ end }}
